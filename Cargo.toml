[workspace]
resolver = "2"
members = [
    "crates/oura-cli",
    "crates/oura-ffi",
    "crates/oura-core",
    "crates/oura-summary",
    "crates/oura-manual",
    "crates/oura-import",
    "crates/oura-backup",
    "crates/oura-protocol-v1",
    "crates/oura-hub",
    "crates/oura-ble",
    "crates/oura-collector",
    "crates/oura-collector-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Th0rgal/open_health"

[profile.release]
lto = true
strip = true

[patch."https://github.com/Th0rgal/open_oura"]
oura-store = { path = "vendor/oura-store" }
