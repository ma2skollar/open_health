# Isolated verification only. Backend and nginx share a Docker network namespace.
events {}
http {
  server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /tmp/health-proxy.crt;
    ssl_certificate_key /tmp/health-proxy.key;
    location / {
      proxy_pass http://localhost:8092;
      proxy_set_header Host localhost:8092;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $http_host;
    }
  }
}
