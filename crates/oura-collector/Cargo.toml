[package]
name = "oura-collector"
description = "History-only Pi collector with a durable signed raw-event outbox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
ble = ["oura-ble/ble"]

[dependencies]
oura-ble = { path = "../oura-ble" }
oura-protocol-v1 = { path = "../oura-protocol-v1" }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
fs2 = "0.4"
rand = "0.8"
libc = "0.2"
zeroize = "1"
bytes = "1"

[dev-dependencies]
tempfile = "3"
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
