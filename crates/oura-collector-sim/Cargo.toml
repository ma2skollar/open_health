[package]
name = "oura-collector-sim"
description = "Deterministic, isolated collector simulation without Bluetooth"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
oura-ble = { path = "../oura-ble" }
oura-collector = { path = "../oura-collector" }
oura-protocol-v1 = { path = "../oura-protocol-v1" }
oura-hub = { path = "../oura-hub" }
async-trait = "0.1"
tokio = { version = "1", features = ["full", "test-util"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
tempfile = "3"
