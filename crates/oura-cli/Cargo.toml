[package]
name = "oura-cli"
description = "Command-line client for reading data directly from an Oura ring"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "oura"
path = "src/main.rs"

# Server-only binary: no BLE backend (btleplug/BlueZ/D-Bus) is linked, so an
# LXC can run the dashboard with no Bluetooth adapter. The `oura` CLI keeps
# the full BLE feature set.
[[bin]]
name = "oura-dashboard"
path = "src/bin/dashboard_main.rs"
[dependencies]
oura-protocol = { git = "https://github.com/Th0rgal/open_oura", rev = "4f7957d3304c4084f0e1e703f3d84606bf10b781" }
oura-link = { git = "https://github.com/Th0rgal/open_oura", rev = "4f7957d3304c4084f0e1e703f3d84606bf10b781", optional = true }
oura-store = { git = "https://github.com/Th0rgal/open_oura", rev = "4f7957d3304c4084f0e1e703f3d84606bf10b781" }
oura-summary = { path = "../oura-summary" }
oura-manual = { path = "../oura-manual" }
oura-import = { path = "../oura-import" }
oura-hub = { path = "../oura-hub" }
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
hex = "0.4"
serde_json = "1"
regex = "1"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
getrandom = "0.3"
tch = { version = "=0.22.0", optional = true } # pinned to libtorch 2.9.0 (repo venv)

[features]
# Run the activity model in-process via LibTorch instead of shelling out to
# tools/run_activity_model.py. On Apple Silicon the only libtorch is the pip
# wheel, so the repo venv is aligned to torch 2.9.0 — the exact version tch 0.22
# targets — and we link against it (no version-check bypass needed). build.rs
# bakes the rpath, so no DYLD_LIBRARY_PATH at runtime:
#   export PATH="$PWD/.venv/bin:$PATH" LIBTORCH_USE_PYTORCH=1
#   cargo run --features torch -- sessions --tz-offset 1
torch = ["dep:tch"]

# Local BLE backend (btleplug → BlueZ/D-Bus). Default-on so the `oura` CLI
# keeps every existing ring command; `oura-dashboard` is built with
# `--no-default-features` in packaging so no BLE backend is linked at all.
ble = ["dep:oura-link"]
default = ["ble"]
