[package]
name = "oura-hub"
description = "Authenticated raw-batch ingress and durable analysis pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "oura-hub"
path = "src/main.rs"

[dependencies]
oura-protocol-v1 = { path = "../oura-protocol-v1" }
oura-summary = { path = "../oura-summary" }
anyhow = "1"
hex = "0.4"
libc = "0.2"
oura-store = { git = "https://github.com/Th0rgal/open_oura", rev = "4f7957d3304c4084f0e1e703f3d84606bf10b781" }
oura-protocol = { git = "https://github.com/Th0rgal/open_oura", rev = "4f7957d3304c4084f0e1e703f3d84606bf10b781" }
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
fs2 = "0.4"
futures-util = "0.3"
http-body-util = "0.1"
rusqlite = { version = "0.31", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
